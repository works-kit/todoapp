# ===============================
# application-prod.properties
# Profile: prod (production)
# SEMUA nilai wajib dari environment variable — tidak boleh ada hardcode
# ===============================

# ── DATASOURCE ──────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=TodoHikariPool-Prod

# ── JPA ─────────────────────────
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── FLYWAY ──────────────────────
spring.flyway.enabled=true

# ── REDIS ───────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# ── ACTUATOR ────────────────────
# Port terpisah 8082 — tidak expose ke public, hanya Prometheus internal
management.server.port=8082
management.endpoints.web.base-path=/internal/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# ── PROMETHEUS ──────────────────
management.prometheus.metrics.export.enabled=true

# ── JWT ─────────────────────────
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ── LOGGING ─────────────────────
logging.level.root=WARN
logging.level.mohammadnuridin.todolist=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.file.name=logs/prod.log

# ── SECURITY HEADERS ────────────
app.security.headers.hsts-enabled=true

# ── RATE LIMITER ────────────────
# Ketat di production
app.rate-limiter.capacity=60
app.rate-limiter.auth.capacity=10