# ===============================
# application-dev.properties
# Profile: dev (Docker Compose lokal)
# Jalankan: docker-compose up
#           atau mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===============================

# ── DATASOURCE ──────────────────
spring.datasource.url=jdbc:mysql://localhost:3307/todoapp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=asdf;lkj
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ─────────────────────────
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── FLYWAY ──────────────────────
spring.flyway.enabled=true

# ── REDIS ───────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# ── ACTUATOR ────────────────────
management.server.port=8082
management.endpoints.web.base-path=/internal/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,flyway
management.endpoint.health.show-details=always

# ── PROMETHEUS ──────────────────
management.prometheus.metrics.export.enabled=true

# ── JWT ─────────────────────────
app.jwt.secret-key=dev-secret-key-for-development-only-minimum-256-bits-long
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=86400000

# ── LOGGING ─────────────────────
logging.level.root=DEBUG
logging.level.mohammadnuridin.todolist=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/dev.log

# ── SECURITY HEADERS ────────────
app.security.headers.hsts-enabled=false

# ── RATE LIMITER ────────────────
# Longgar untuk dev
app.rate-limiter.capacity=500
app.rate-limiter.auth.capacity=50