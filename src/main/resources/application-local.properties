# ===============================
# application-local.properties
# Profile: local (unit test / tanpa Docker)
# Jalankan: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ===============================

# ── DATASOURCE ──────────────────
# H2 in-memory, otomatis hilang saat app mati
spring.datasource.url=jdbc:h2:mem:todolist_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console — akses http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DDL dihandle Hibernate (bukan Flyway) saat local
spring.flyway.enabled=false

# ── JPA ─────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Ini harus ada dan eksplisit override base
spring.jpa.hibernate.ddl-auto=create-drop

# ── REDIS ───────────────────────
management.health.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# ── ACTUATOR ────────────────────
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=always

# ── JWT ─────────────────────────
app.jwt.secret-key=local-secret-key-for-testing-only-minimum-256-bits-long
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=86400000

# ── LOGGING ─────────────────────
logging.level.root=DEBUG
logging.level.mohammadnuridin.todolist=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/local.log

# ── SECURITY HEADERS ────────────
app.security.headers.hsts-enabled=false

# ── RATE LIMITER ────────────────
# Longgar untuk kemudahan testing
app.rate-limiter.capacity=1000
app.rate-limiter.auth.capacity=100