# ===============================
# application-staging.properties
# Profile: staging (cloud server, mirror prod)
# Semua nilai sensitif dari environment variable
# ===============================

# ── DATASOURCE ──────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ── JPA ─────────────────────────
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── FLYWAY ──────────────────────
spring.flyway.enabled=true

# ── REDIS ───────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# ── ACTUATOR ────────────────────
management.server.port=8082
management.endpoints.web.base-path=/internal/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,flyway
management.endpoint.health.show-details=when-authorized

# ── PROMETHEUS ──────────────────
management.prometheus.metrics.export.enabled=true

# ── JWT ─────────────────────────
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ── LOGGING ─────────────────────
# Level & appender dikelola logback-spring.xml
# Hanya threshold performa di sini
app.logging.slow-request-threshold-ms=1000
app.logging.slow-query-threshold-ms=300
app.logging.slow-service-threshold-ms=2000


# ── SECURITY HEADERS ────────────
app.security.headers.hsts-enabled=true
app.security.headers.frame-options=DENY
app.security.headers.csp=default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests

# ── RATE LIMITER ────────────────
app.rate-limiter.capacity=100
app.rate-limiter.auth.capacity=20

# ── Spring DOC ────────────────
springdoc.api-docs.enabled=false